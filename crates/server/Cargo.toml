# 新しい castlist の server（AI-36）。定義（model/）から作った骨（crates/castlist-sdk/）に処理を入れ、
# 手の道（画面・backup・logs）と 1 つの axum の Router に並べる。切り替え（AI-36 の段 8）まで image には入らない。
[package]
name = "castlist-next"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
castlist_sdk = { path = "../castlist-sdk" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
aws-smithy-types = "1.9.4"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
# 出来事の detail（DB の JSON の字）を、答えの Document に直す。
serde_json = "1"
# SQL は動く時に組む形（query・query_as）だけを使う。macros は、移行の SQL を埋め込む migrate!() のため（今の server と同じ）。
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tower = { version = "0.5", features = ["util"] }
# 記録（root の crate と同じ版と features）。
tracing = { version = "0.1", default-features = false, features = ["std"] }
# アクターの id（UUID v7）。
uuid = { version = "1", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }

[lints.clippy]
await_holding_lock = "deny"
disallowed_methods = "deny"
