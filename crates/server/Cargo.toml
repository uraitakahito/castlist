# castlist の server。定義（model/）から作った骨（crates/castlist-sdk/）に処理を入れ、
# 手の道（backup・logs）と 1 つの axum の Router に並べる。
[package]
name = "castlist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
# server を起こす binary（image の中の /castlist-server）。
name = "castlist-server"
path = "src/main.rs"

[dependencies]
castlist_sdk = { path = "../castlist-sdk" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
aws-smithy-types = "1.9.4"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
# 外に出る誤りの文を、言語ごとの file（crates/server/locales/）から引く（Fluent。AI-48）。.ftl は build の時に binary へ埋める（macros）。
# walkdir は、macro が build の時に locales/ を歩くのに要る（ignore か walkdir のどちらかが要る。小さい方）。
fluent-templates = { version = "0.15.1", default-features = false, features = ["macros", "walkdir"] }
# 頼みの Accept-Language から言語を選ぶ（fluent-templates が使う版に合わせる。0.14 は言語の型が違う）。
fluent-langneg = "0.13"
# 出来事の detail（DB の JSON の字）を、答えの Document に直す。
serde_json = "1"
# 同じ id で同じ本文かを見る写し（body_hash。SHA-256）。
sha2 = { version = "0.11.1", default-features = false }
# SQL は動く時に組む形（query・query_as）だけを使う。macros は、移行の SQL を埋め込む migrate!() のため。
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
# binary の起動・待ち受け・止める合図・時間切れ・backup の file と、記録を読む重い手（spawn_blocking）に使う。
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
# backup の file を、読みながら送る。
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
# 問い合わせごとの記録（method・path・status・かかった時間）。
tower-http = { version = "0.7", default-features = false, features = ["trace"] }
# 記録。
tracing = { version = "0.1", default-features = false, features = ["std"] }
# 時刻つきの記録。書き先は stdout と、大きさで回す file（src/runlog.rs）。
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
# アクターの id（UUID v7）。
uuid = { version = "1", default-features = false, features = ["std", "v7"] }

[lints.clippy]
await_holding_lock = "deny"
disallowed_methods = "deny"
