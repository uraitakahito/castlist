name: docs

# docs/ の本（mdBook）を作り、GitHub Pages（https://uraitakahito.github.io/castlist/）に出す。
#   - PR・main への push: 作れるかを見るだけ（job docs）。出さない。
#   - release の tag（v*）の push・手動の起動: 作った物を Pages に出す（job deploy）。
# PR で動く job には pages・id-token の権限を渡さない（PR の branch から本物の site に出さないため）。
# path で絞らない: job docs を main を守る ruleset の必須の check にした時、docs を触らない PR で結果が出なくなる。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 道具の版。上げる時は、release の file（linux x86_64）の SHA-256 も一緒に上げる。
  MDBOOK_VERSION: 0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

# action は commit の SHA で固定する（tag は後から中身が替わりうる）。
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: mdbook を入れる（版と checksum を固定）
        run: |
          mkdir -p "$HOME/docs-tools/bin"
          curl -fsSL -o "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$HOME/docs-tools/bin"
          echo "$HOME/docs-tools/bin" >> "$GITHUB_PATH"
      - name: 本を作る
        run: mdbook build docs
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    # 出すのは、release の tag か手動の起動の時だけ。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
