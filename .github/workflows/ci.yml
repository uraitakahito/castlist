name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 弱点の知らせは commit と関わりなく出るので、週に 1 度も流す（月曜 00:00 UTC）。
    - cron: "0 0 * * 1"
permissions:
  contents: read
env:
  # 秘密の走査の道具。版と、release の checksums.txt の値（linux_arm64）を一緒に上げる。
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
# action は commit の SHA で固定する（tag は後から中身が替わりうる）。
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo fmt --all --check
      # 塞ぐ呼び出し（clippy.toml の disallowed-methods）と、鍵を握ったままの await も、ここで落ちる。
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # 定義の例（@httpRequestTests・@httpResponseTests）から作った、生成した骨の中の試験（protocol の試験）。
      - run: cargo test --locked -p castlist_sdk
      # 台帳は足すだけ: Rust の source に、行を書き替える・消す SQL が無いか。
      - run: ci/check-sql.sh
      # 見張りが、そういう SQL を本当に当てるか（当てなければ落とす）。
      - run: "! ci/check-sql.sh ci/testdata/bad-sql.rs"
      # 公開する字に、1 台の機械（「この Mac」）やある人の手元を指す言い方が無いか。
      - run: ci/check-wording.sh
      # 見張りが、そういう字を本当に当てるか（当てなければ落とす）。
      - run: "! ci/check-wording.sh ci/testdata/bad-wording.md"
      - run: "! ci/check-wording.sh ci/testdata/bad-label.md"
      # 前の画面の字（居るか・時間の帯・関係の網・時計のずれた行など）も当てるか。
      - run: "! ci/check-wording.sh ci/testdata/bad-words.md"
      # 「動かす」の container の命令が、名 castlist.box を指し、pm-only の守り（.claude/roles/config.jsonc）に当たるか。
      - run: ci/check-run-docs.sh
      # 見張りが、名の違う命令と守りから漏れた命令を本当に当てるか（当てなければ落とす）。
      - run: "! ci/check-run-docs.sh ci/testdata/bad-run.md"
      # release の workflow が使う、tag と版の突き合わせ（ci/check-release-version.sh）の試験。
      - run: ci/test-check-release-version.sh
      # 取り込んだ外の JavaScript（static/vendor/）が、npm に出ている物と同じか（static/vendor/SOURCES.md）。
      - run: ci/check-vendor.sh
      # 見張りが、書き替えた file を本当に当てるか（当てなければ落とす）。
      - name: 見張りが、書き替えた写しを当てるか
        run: |
          cp static/vendor/cytoscape-3.35.0.min.js "$RUNNER_TEMP/bad.js"
          echo '//' >>"$RUNNER_TEMP/bad.js"
          ! ci/check-vendor.sh "$RUNNER_TEMP/bad.js"
  model:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 定義を release の tag と比べるため、tag も取る。
          fetch-depth: 0
      # 生成器が作った crate に流す cargo fmt を、rust-toolchain.toml の版にする。
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # Smithy の CLI の zip（版と digest を ci/gen.sh が固め、毎回 digest を見る）・公開から 2 日たったと見た依存の印・
      # smithy build が Maven Central から取る物（~/.m2/repository）を cache に置き、毎回は取りに行かない（開いた CLI は gen.sh が毎回 zip から開くので入れない。429 で落ちたため）。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/castlist-smithy
            !~/.cache/castlist-smithy/*/smithy-cli-*
            ~/.m2/repository
          key: smithy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/gen.sh', 'model/smithy-build.json') }}
      # 定義（model/）から作った骨（crates/castlist-sdk/）が、入れてある物と同じか。
      # Smithy の CLI は版と digest を固めて取る（JRE を同梱しているので Java は要らない）。生成器は公開から 2 日たった物だけ。
      - run: ci/gen.sh --check
      # 定義が、定義の入った最新の release から壊す形に変わっていないか（smithy diff。DANGER 以上で落ちる）。
      - run: ci/gen.sh --diff
  load:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # 一時の DB（tests/common の temp_db は TMPDIR の下）を memory の上に置く。CI の機械の disk は書き込みが時々
      # 100〜200 ms 詰まり、書く接続（1 本）に並んだ書き手の待ちが積もって 2 秒（WRITE_WAIT）を越え、503 で落ちた
      # （t-8b6j の測り: disk では約 30 回のうち 3 回落ち、/dev/shm では 10 回とも最大 100 ms 未満）。
      # この試験が見るのは castlist の詰まりで、CI の機械の disk ではない。
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # 本物の binary を起こし、50 の客が 10 秒叩く（誤りと 5xx が 0・p99 が 1 秒未満。tests/load.rs）。
      - run: cargo test --locked --release --test load -- --ignored --nocapture
  e2e:
    if: github.event_name != 'schedule'
    # 相関図（/graph/network。script を使う唯一の画面）と、一覧の期間の欄（日時の欄と期間の link）を、本物の browser（Chromium）で見る（e2e/ の Playwright の試験）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: 試験が起こすサーバーを作る
        run: cargo build --locked --bin castlist-server
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.node-version
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Node の依存を、lock のとおりに入れる
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Chromium の cache（版は lock の Playwright の版で決まる）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - name: Chromium と、それが要る library を入れる
        working-directory: e2e
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: 相関図と期間の欄の試験
        working-directory: e2e
        env:
          # 上の段で作った物を起こす（作り直さない）。
          CASTLIST_E2E_SERVER: ../target/debug/castlist-server
        run: pnpm test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
  image:
    if: github.event_name != 'schedule'
    # 動かす機械（Apple Container の動く Apple silicon）と同じ CPU の種類（arm64）で作る。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 出どころの記録（provenance・SBOM）は付けない。付ける時は、中身を見てから。
      - run: docker build --provenance=false --sbom=false -t castlist:ci -f Containerfile .
      - name: gitleaks を入れる（版と checksum を固定）
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
      - name: image に、入ってよい物だけが入っているか（中身の一覧・設定・秘密の走査）
        run: ci/check-image.sh castlist:ci
      - name: 空の image の中で起き、書いて読め、断るべき物を断り、止めて起こし直せるか
        run: ci/smoke-image.sh castlist:ci
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          # 弱点と、crate の license（MIT の castlist と一緒に配れる物か）。
          command: check advisories licenses
          # workspace の member をみな見る（root は仮想の workspace なので、付けないと既定の member だけを見る）。
          # この action の既定は --all-features だが、arguments を書くと置き換わる。見るのは、image と CI で build する
          # 既定の features の依存だけ、と決めた（build しない features の依存は見ない。pagetray の review-17）。
          arguments: --workspace
      # 画面の browser の試験（e2e/）の Node の依存の弱点。lock だけを見る（入れない）。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.node-version
      - working-directory: e2e
        run: pnpm audit
